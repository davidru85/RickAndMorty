# Gradle configuration for the whole build.
#
# Only the keys below are present. A machine path, a JDK pin, an SDK directory
# or a warning suppression is never committed (AGENTS.md §15, SECURITY.md §4).

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
android.useAndroidX=true

# Package root: declared once. Every Android namespace, the application id and
# the Kotlin package directories derive from it (OD-2, GUIDELINES.md §7.3).
multiverse.packageRoot=io.github.davidru85.multiverse
