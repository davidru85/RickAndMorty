# The iOS app project, generated by XcodeGen 2.46.0 (TASK-051).
#
# This file is the source; `MultiverseExplorer.xcodeproj/project.pbxproj` is generated from it and
# committed, together with the shared workspace data `.gitignore` allows, so a checkout builds
# without running XcodeGen. After editing this file, run `xcodegen generate --spec project.yml` here
# and commit the regenerated project with it; regenerating an unchanged spec reproduces the file.
name: MultiverseExplorer

# The snapshot library `DEC-025` names (`TESTING.md` §8.3): committed baselines for the iOS design
# system and the feature screens, pinned by version so a resolution cannot drift.
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.2

options:
  bundleIdPrefix: io.github.davidru85.multiverse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# `VERSION` is the single version source (`REQ-NFR-006`, `DEC-067`). XcodeGen reads this xcconfig,
# which the build generates from `VERSION`, so `CFBundleShortVersionString` derives from the one
# file rather than from a literal in this project definition.
configFiles:
  Debug: App/Version.xcconfig
  Release: App/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The app links exactly one Kotlin framework (ADR-0012) and no second one may appear.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Which framework `:core:ios` built for this build: the simulator and the device are different
    # Kotlin targets, and Debug and Release different binaries. A fixed simulator-debug path made
    # every device or Release build link the wrong object file.
    "KOTLIN_FRAMEWORK_TARGET[sdk=iphonesimulator*]": iosSimulatorArm64
    "KOTLIN_FRAMEWORK_TARGET[sdk=iphoneos*]": iosArm64
    KOTLIN_FRAMEWORK_DIR: $(SRCROOT)/../core/ios/build/bin/$(KOTLIN_FRAMEWORK_TARGET)/$(KOTLIN_FRAMEWORK_BUILD)Framework
  configs:
    Debug:
      KOTLIN_FRAMEWORK_BUILD: debug
    Release:
      KOTLIN_FRAMEWORK_BUILD: release

targets:
  MultiverseExplorer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      # The portrait seam (`TASK-058`): the image pipeline lives in its own folder, owned by
      # `TASK-058`, and is compiled into the app target like every other source.
      - path: ImagePipeline
      - path: DesignSystem
        # `README.md` documents the components; it is not a bundle resource, and a non-code file in
        # the app bundle breaks code signing.
        excludes:
          - "README.md"
      # The committed copy files (`TASK-060`): `en.lproj`/`es.lproj` are copied into the bundle root
      # as localised resources, so the strings the parity test compares are the ones the app loads.
      # Each locale folder is a separate group: a single `folder` source would nest them under
      # `Resources/`, where iOS does not look for a localisation.
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/es.lproj
        buildPhase: resources
      # The asset catalog (`DEC-139`): the brand's portal logo as a vector PDF, exported from Figma
      # `Brand/Portal logo` (`16:13`), for the splash, the empty states and a failed portrait.
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Multiverse Explorer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Single appearance (`UI_SPEC.md` §9): the app is dark-only on both platforms.
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidru85.multiverse.app
        # The Kotlin framework is named for the product, so the Swift module needs its own name:
        # otherwise `import MultiverseExplorer` is read as a self-import and ignored.
        PRODUCT_MODULE_NAME: MultiverseApp
        MARKETING_VERSION: $(MULTIVERSE_VERSION)
        CURRENT_PROJECT_VERSION: 1
        # The framework search path points at the Gradle-built Kotlin framework (ADR-0012): the app
        # links exactly one, produced by `:core:ios` for the active SDK and configuration.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(KOTLIN_FRAMEWORK_DIR)
        # The framework is linked explicitly rather than through a `dependencies: framework:` entry,
        # because that entry resolves against the device SDK while this target builds for the
        # simulator; `-framework` with the search path above resolves for whichever SDK is active.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - MultiverseExplorer
        SWIFT_EMIT_LOC_STRINGS: YES
        # The asset catalog holds the portal logo only (`DEC-139`); the app icon is not packaged in it
        # (`UI_SPEC.md` §10.2), so the compiler is not told to look for one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    preBuildScripts:
      - name: Build the shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          # Link the framework the search path expects: the simulator or the device target, in the
          # Debug or Release build, so a device or Release build never links a simulator object.
          case "$PLATFORM_NAME" in
            iphonesimulator) TARGET=IosSimulatorArm64 ;;
            iphoneos) TARGET=IosArm64 ;;
            *) echo "error: no Kotlin framework target for platform '$PLATFORM_NAME'"; exit 1 ;;
          esac
          case "$CONFIGURATION" in
            Release) BUILD=Release ;;
            *) BUILD=Debug ;;
          esac
          ./gradlew ":core:ios:link${BUILD}Framework${TARGET}"
        basedOnDependencyAnalysis: false

  MultiverseExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MultiverseExplorer
      - package: SnapshotTesting
    settings:
      base:
        # The test bundle needs its own Info.plist. XcodeGen does not synthesise one for a unit-test
        # target, and without this the target cannot be code-signed or run (`TASK-052` adds the first
        # cases; the setting only matters once a test file exists).
        GENERATE_INFOPLIST_FILE: YES
        # `@testable import MultiverseApp` loads the app module's dependency graph, which includes
        # the Kotlin framework (ADR-0012); the test target resolves it from the same path the app
        # uses, so the framework's Swift module is found during testing too.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(KOTLIN_FRAMEWORK_DIR)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - MultiverseExplorer

# The one shared scheme, committed so every machine runs the same test configuration. The test action
# pins the language and region: the screen baselines render the app's own localised copy, so a
# simulator set to another language would otherwise compare a different string set against them.
schemes:
  MultiverseExplorer:
    build:
      targets:
        MultiverseExplorer: all
        MultiverseExplorerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - MultiverseExplorerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
