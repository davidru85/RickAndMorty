# The Robolectric build-system inputs for this module's Android host tests (`TEST-UI-001`,
# `TEST-UI-003`, `TEST-UI-009`).
#
# A Kotlin Multiplatform library's host-test run gets no `com/android/tools/test_config.properties`
# from AGP: there is no test APK, so there is no merged manifest and no merged resources to point at,
# and Robolectric must be told where they are — otherwise the Compose rule cannot resolve the activity
# it hosts its content in, and the Android copy set `:core:designsystem` ships (the one this module's
# strings come from) is not on the resource path at all.
#
# The paths are relative to the test worker's working directory, which is this module's directory —
# the convention AGP's own generated file uses.
android_custom_package=org.robolectric.default
android_merged_manifest=src/androidHostTest/resources/AndroidManifest.xml
android_merged_resources=../../core/designsystem/src/main/res
