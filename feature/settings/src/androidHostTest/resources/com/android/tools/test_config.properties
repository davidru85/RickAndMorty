# The Robolectric build-system inputs for this module's Android host tests (`TEST-UI-017`).
#
# A Kotlin Multiplatform library's host-test run gets no `com/android/tools/test_config.properties`
# from AGP: there is no test APK, so there is no merged manifest and no merged resources to point at,
# and Robolectric must be told where they are. Without this file the Compose rule cannot resolve the
# activity it hosts its content in, and the Android copy set `:core:designsystem` ships (the one this
# module's strings come from) is not on the resource path at all.
#
# Every path is relative to the test worker's working directory, which is this module's directory —
# the same convention AGP's generated file uses. The manifest is the one `ui-test-manifest` declares
# for an app's debug APK; a library has no merge, so it is committed here instead.
android_custom_package=io.github.davidru85.multiverse.feature.settings
android_merged_manifest=src/androidHostTest/resources/AndroidManifest.xml
android_merged_resources=../../core/designsystem/src/main/res
