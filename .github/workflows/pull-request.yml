# DEC-112 / TASK-110: independent checks, with the existing required android result.
# The active coverage is owned by docs/TESTING.md 14.2. Workers run on the same revision,
# without path filters or dependencies on one another. Only the final result waits.
# DEC-083 keeps native CI suspended until TASK-051; the workflow guard retains its tripwire.
name: pull-request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  module-checks:
    name: module / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-domain
            module: :core:domain
            tasks: :core:domain:compileAndroidMain :core:domain:testAndroidHostTest :core:domain:ktlintCheck :core:domain:jvmTest
          - name: core-data
            module: :core:data
            tasks: :core:data:compileAndroidMain :core:data:testAndroidHostTest :core:data:ktlintCheck :core:data:jvmTest
          - name: core-presentation
            module: :core:presentation
            tasks: :core:presentation:compileAndroidMain :core:presentation:testAndroidHostTest :core:presentation:ktlintCheck
          - name: core-testing
            module: :core:testing
            tasks: :core:testing:compileAndroidMain :core:testing:testAndroidHostTest :core:testing:ktlintCheck :core:testing:jvmTest
          - name: core-diagnostics
            module: :core:diagnostics
            tasks: :core:diagnostics:compileAndroidMain :core:diagnostics:testAndroidHostTest :core:diagnostics:ktlintCheck
          - name: feature-discovery
            module: :feature:discovery
            tasks: :feature:discovery:compileAndroidMain :feature:discovery:testAndroidHostTest :feature:discovery:ktlintCheck
          - name: feature-character-detail
            module: :feature:character-detail
            tasks: :feature:character-detail:compileAndroidMain :feature:character-detail:testAndroidHostTest :feature:character-detail:ktlintCheck
          - name: feature-favorites
            module: :feature:favorites
            tasks: :feature:favorites:compileAndroidMain :feature:favorites:testAndroidHostTest :feature:favorites:ktlintCheck
          - name: feature-episodes
            module: :feature:episodes
            tasks: :feature:episodes:compileAndroidMain :feature:episodes:testAndroidHostTest :feature:episodes:ktlintCheck
          - name: feature-settings
            module: :feature:settings
            tasks: :feature:settings:compileAndroidMain :feature:settings:testAndroidHostTest :feature:settings:ktlintCheck
    env:
      GRADLE_TASKS: ${{ matrix.tasks }}
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compile, test and format this module
        run: ./gradlew $GRADLE_TASKS --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: module-${{ matrix.name }}-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/ktlint/**
          if-no-files-found: ignore

  designsystem:
    name: module / core-designsystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run this verification scope
        run: ./gradlew :core:designsystem:check --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: designsystem-reports
          path: |
            core/designsystem/build/reports/**
            core/designsystem/build/test-results/**
          if-no-files-found: ignore

  app-tests:
    name: module / androidApp tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run this verification scope
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:lint :androidApp:verifyRoborazziDebug :feature:discovery:verifyRoborazziAndroidHostTest :feature:character-detail:verifyRoborazziAndroidHostTest :feature:favorites:verifyRoborazziAndroidHostTest :feature:settings:verifyRoborazziAndroidHostTest --stacktrace
      - name: Upload snapshot baselines and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-tests-snapshots
          path: |
            **/src/*/snapshots/**
          if-no-files-found: ignore
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-tests-reports
          path: |
            androidApp/build/reports/**
            androidApp/build/test-results/**
          if-no-files-found: ignore

  app-artifacts:
    name: module / androidApp artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run this verification scope
        run: ./gradlew :androidApp:assembleDebug :androidApp:verifyReleaseArtifact :androidApp:verifySdkLevels :androidApp:verifyShippedPermissions :androidApp:verifyMilestoneIndependence --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-artifacts-reports
          path: |
            androidApp/build/reports/verifyReleaseArtifact/**
            androidApp/build/reports/verifySdkLevels/**
            androidApp/build/reports/verifyShippedPermissions/**
            androidApp/build/reports/verifyMilestoneIndependence/**
            androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  build-logic:
    name: build-logic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify failure propagation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Run this verification scope
        run: ./gradlew :build-logic:convention:check --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logic-reports
          path: |
            build-logic/convention/build/reports/**
            build-logic/convention/build/test-results/**
          if-no-files-found: ignore

  policies:
    name: repository policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run this verification scope
        run: ./gradlew verifyModuleBoundaries verifyDependencyPolicy verifyRepositoryHygiene verifyNoLiveHosts verifyWorkflowGate verifyDocumentedGate --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policies-reports
          path: |
            build/reports/**
          if-no-files-found: ignore

  dependency-health:
    name: dependency health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run this verification scope
        run: ./gradlew buildHealth --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-health-reports
          path: |
            **/build/reports/dependency-analysis/**
          if-no-files-found: ignore

  contract-replay:
    name: contract fixtures / Android host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run this verification scope
        run: ./gradlew :core:data:contractTestReplayAndroidHost --stacktrace
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-replay-reports
          path: |
            core/data/build/reports/tests/**
            core/data/build/test-results/**
          if-no-files-found: ignore

  ios:
    name: ios
    # The `xcode-27` image carries the toolchain `tools/swift-tools.lock` pins (`macos-latest`
    # ships Xcode 26.x, whose swift-format is not the locked one). Verified against the runner-image
    # toolset listing on 2026-10-04; the job fails closed, naming the available toolchains, if the
    # locked Xcode is absent.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The shared suites on the Apple simulator target and the native contract replay. Both are
      # blocking again now that the app target exists (`TASK-051` restored them; the suspension of
      # `DEC-083` ended with the `iosApp` application target the tripwire detects).
      - name: Run the shared suites on the Apple target
        run: ./gradlew iosSimulatorArm64Test --stacktrace
      # `TASK-070`: `:core:ios` has no Android target, so it is deliberately absent from the
      # `module-checks` matrix. Its formatter therefore ran in no job, and `./gradlew check` failed
      # locally on a file no CI job checked. It is a Kotlin module like the others, so its formatter
      # belongs beside the Apple suites rather than nowhere.
      - name: Check the framework module's Kotlin formatting
        run: ./gradlew :core:ios:ktlintCheck --stacktrace
      - name: Replay the contract suite on the Apple target
        run: ./gradlew :core:data:contractTestReplayIosSimulator --stacktrace
      # The pinned Swift toolchain, then the formatting and lint row (`DEC-076`, `TASK-051`). The
      # script verifies the lock's SHA-256 before it runs either tool and fails closed otherwise.
      # `macos-latest` selects its own Xcode (26.6 at the time of writing) while `swift-tools.lock`
      # pins swift-format to the Xcode the project verified, so the job selects that toolchain
      # explicitly. Without this the quality gate fails closed — correctly — on a runner whose
      # default Xcode is not the locked one.
      - name: Select the pinned Xcode
        run: |
          LOCKED="$(awk '$1 == "swift-format" { print $2 }' tools/swift-tools.lock | sed "s/@Xcode-//")"
          echo "tools/swift-tools.lock pins Xcode $LOCKED"
          # The runner names the bundle with the version the lock records (`Xcode_27.0.app`) while the
          # active selection may report it without the patch component (`Xcode_27.app`); both spellings
          # name the same toolchain, so both are accepted rather than failing on the directory name.
          SELECTED=""
          for candidate in "/Applications/Xcode_$LOCKED.app" "/Applications/Xcode_${LOCKED%.*}.app"; do
            if [ -d "$candidate" ]; then
              SELECTED="$candidate"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            sudo xcode-select -s "$SELECTED"
          elif [ -n "$(xcodebuild -version 2>/dev/null | awk '/^Xcode /{ print $2 }' | grep -x "$LOCKED" || true)" ]; then
            # The selected toolchain already reports the locked version, so no change is needed.
            echo "the active Xcode already reports $LOCKED"
          else
            echo "WARNING: /Applications/Xcode_$LOCKED.app is not installed on this runner; the available toolchains are:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          xcodebuild -version
      - name: Set up the Swift tools
        run: bash tools/swift-tools-setup.sh
      # `TEST-UNIT-046` covers these scripts themselves, and nothing ran them: the suite that proves
      # the Swift gate fails closed was itself unchecked by any job, so a defect in it would surface
      # only as a red `ios` job. It needs no simulator and no network.
      - name: Prove the Swift quality scripts fail closed
        run: bash tools/swift-tools-test.sh
      - name: Swift formatting and lint
        run: bash tools/swift-lint.sh iosApp
      # The snapshot baselines are recorded on this device and runtime — the iOS 27.0 runtime the pinned
      # Xcode ships, which the runner provides — so a different runtime, which renders glass
      # differently, fails visibly instead of being compared against the wrong reference.
      - name: Build the iOS app and run its tests and snapshot baselines
        run: xcodebuild test -project iosApp/MultiverseExplorer.xcodeproj -scheme MultiverseExplorer -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' -resultBundlePath build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            build/ios-tests.xcresult/**
          if-no-files-found: ignore

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [module-checks, designsystem, app-tests, app-artifacts, build-logic, policies, dependency-health, contract-replay, ios]
    env:
      CI_JOB_RESULTS: ${{ toJSON(needs) }}
      CI_REQUIRE_IOS: "true"
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require every independent check to succeed
        run: python3 .github/scripts/verify-ci-results.py
