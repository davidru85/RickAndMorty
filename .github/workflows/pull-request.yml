# Pull-request gate (TASK-025, DEC-054 as amended by DEC-071 and DEC-083).
#
# The required-check set is owned by docs/TESTING.md §14 and its names by
# docs/CONTRIBUTING.md §5.3. Every job below runs on every pull request and is required;
# none may be skipped. Under DEC-071 the set is activated in stages: a row becomes
# mandatory and non-empty in the same change that introduces its harness. This workflow
# therefore runs, as blocking checks, exactly the suites that exist today:
#
#   - the shared suites (commonTest) on the JVM via the Android host-test target;
#   - the contract suite in fixture/replay mode on the Android host target
#     (`:core:data:contractTestReplayAndroidHost`, TASK-037, DEC-073, DEC-090);
#   - the build-logic regression suite, which runs inside the root `check`;
#   - every policy task: module boundaries, dependency pins/rationale/inventory,
#     repository hygiene, the live-host guard and this workflow's own guard;
#   - the Android assemble.
#
# Temporary iOS suspension (DEC-083, owner directive 2026-10-02): the `ios` job — the shared
# suites on Kotlin/Native, the Apple compiles and the native contract replay — is suspended
# until the pull request that introduces the buildable `iosApp` application target (TASK-051).
# `verifyWorkflowGate` reads the real Xcode project metadata and fails that pull request until
# it restores the job here, with `iosSimulatorArm64Test` and
# `:core:data:contractTestReplayIosSimulator`; the `ios` required context is restored in the
# ruleset in the same change. The Kotlin/Native targets stay configured, and native validation
# runs locally on macOS meanwhile; it is never reported as CI evidence.
#
# Rows whose harness does not exist yet (Roborazzi snapshots, the accessibility suites, the iOS
# app suites) are recorded against their activation tasks in docs/TESTING.md §14.2 and MUST NOT
# be faked here by an empty or always-green job: an absent check is a missing check, not a pass.
#
# Security: every action is pinned by full commit SHA, never by a moving tag (SECURITY.md
# §9, DEC-037). A floating tag could change the code that executes with this repository's
# token.

name: pull-request

on:
  pull_request:
    branches: [main]
  # `main` is gated too: AC-REQ-FUNC-014-1 requires that `main` builds at every commit, and a
  # post-merge run is the evidence for the merged head rather than for the pull request that
  # produced it.
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same pull request. The gate still
# evaluates the final state of the pull request (TESTING.md §14.1), so cancelling an
# obsolete run is safe and saves minutes.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The daemon JVM is declared by the repository (gradle/gradle-daemon-jvm.properties);
  # this is the toolchain the wrapper provisions and the version both runners install.
  JAVA_VERSION: "25"

jobs:
  # The Linux runner: shared suites on the JVM, the contract fixtures, the build-logic suite,
  # every policy task and the Android assemble. Covers the `shared-tests`, `contract-fixture`,
  # `static-analysis` (the parts that exist), `dependency-analysis`, `repository-hygiene`,
  # `android-assemble` and `milestone-independence` rows of TESTING.md §14.2.
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hygiene check scans every blob reachable from all local refs and fails closed
          # on a shallow clone, so the full history is required (TESTING.md §14.2, DEC-062).
          fetch-depth: 0

      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run the local gate
        run: ./gradlew check --stacktrace

      # TASK-029: the quality toolchain is part of the gate, not a local convention.
      # ktlint, Android Lint and the dependency policy run inside `check`; `buildHealth`
      # and the documented-gate check are separate tasks and are visible as named steps.
      - name: Verify dependency health
        run: ./gradlew buildHealth --stacktrace

      - name: Verify the documented gate
        run: ./gradlew verifyDocumentedGate --stacktrace

      # The policy checks run inside `check` too; they are named here because the `ios` job that
      # used to carry them is suspended (DEC-083) and the guard binds each one to an executable step.
      - name: Run the policy checks
        run: ./gradlew verifyModuleBoundaries verifyDependencyPolicy verifyRepositoryHygiene verifyNoLiveHosts verifyWorkflowGate --stacktrace

      # TASK-037 (DEC-073, DEC-090): exactly the TEST-CONTRACT-* cases on the Android host target,
      # failing when none executes. A separate invocation, so `check` above keeps every case.
      - name: Replay the contract fixtures
        run: ./gradlew :core:data:contractTestReplayAndroidHost --stacktrace

      - name: Assemble the Android application
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            build-logic/convention/build/reports/tests/**
            build-logic/convention/build/test-results/**
          if-no-files-found: ignore
